<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialBridge</title>
    <!-- Load Tailwind CSS for fast and clean styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">🚀 SocialBridge</h1>
        
        <form id="uploadForm" class="space-y-4">
            <div class="mb-6 flex justify-center flex-wrap gap-3 border-b border-gray-200 pb-6">
                <a href="/api/auth/youtube" class="bg-red-600 text-white font-bold py-2 px-4 rounded-md hover:bg-red-700 transition flex items-center gap-2 text-sm">
                    ▶ Connect YouTube
                </a>
                <a href="/api/auth/instagram" class="text-white font-bold py-2 px-4 rounded-md transition flex items-center gap-2 text-sm" style="background: linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);">
                    📸 Connect Instagram
                </a>
                <a href="#" class="bg-black text-white font-bold py-2 px-4 rounded-md hover:bg-gray-800 transition flex items-center gap-2 text-sm">
                    🎵 Connect TikTok
                </a>
            </div>
            <div id="igToast" class="hidden mb-4 text-sm text-green-700 bg-green-100 border border-green-300 rounded-md px-3 py-2 text-center">
                ✅ Instagram connected successfully!
            </div>
            
            <!-- Video Upload -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Video (MP4 - 9:16)</label>
                <input type="file" id="videoFile" accept="video/mp4" required
                    class="mt-1 block w-full text-sm text-gray-500
                    file:mr-4 file:py-2 file:px-4
                    file:rounded-md file:border-0
                    file:text-sm file:font-semibold
                    file:bg-blue-50 file:text-blue-700
                    hover:file:bg-blue-100 border border-gray-300 rounded-md p-2">
            </div>

            <!-- Topic / Caption -->
            <div>
                <div class="flex justify-between items-center">
                    <label class="block text-sm font-medium text-gray-700">Description / Topic</label>
                    <button type="button" id="aiBtn" class="text-xs bg-purple-100 text-purple-700 px-2 py-1 rounded font-bold hover:bg-purple-200 transition">
                        ✨ Generate with AI
                    </button>
                </div>
                <textarea id="captionTopic" rows="4" placeholder="Enter a topic (e.g., Home workout tips) and click the AI button, or write your own caption..." 
                    class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
            </div>
            
            <!-- Hidden field for storing AI generated hashtags -->
            <input type="hidden" id="hashtagsData" value="[]">

            <!-- Date & Time -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Schedule for:</label>
                <input type="datetime-local" id="scheduledAt" required
                    class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700 transition mt-4">
                Schedule Upload
            </button>
            
            <p id="statusMessage" class="text-sm text-center font-medium mt-3 hidden"></p>
        </form>
    </div>

    <script>
        // Show success toast when redirected back from Instagram OAuth
        if (new URLSearchParams(window.location.search).get('ig_connected') === '1') {
            document.getElementById('igToast').classList.remove('hidden');
            window.history.replaceState({}, '', '/');
        }

        // --- AI Generation Logic ---
        document.getElementById('aiBtn').addEventListener('click', async () => {
            const topicStr = document.getElementById('captionTopic').value;
            const aiBtn = document.getElementById('aiBtn');
            
            if (!topicStr) {
                alert("Please enter a topic first!");
                return;
            }

            aiBtn.innerText = "⏳ Thinking...";
            aiBtn.disabled = true;

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic: topicStr })
                });
                
                const data = await response.json();
                
                // Combine the returned caption and hashtags into the textarea so the user can review/edit
                const tagsList = JSON.parse(data.hashtags || "[]");
                document.getElementById('captionTopic').value = data.caption + "\n\n" + tagsList.join(" ");
                document.getElementById('hashtagsData').value = data.hashtags;
                
            } catch (error) {
                alert("AI Error: " + error.message);
            } finally {
                aiBtn.innerText = "✨ Generate with AI";
                aiBtn.disabled = false;
            }
        });

        // --- Video Upload Logic ---
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('statusMessage');
            btn.disabled = true;
            btn.innerText = "Uploading...";
            
            const formData = new FormData();
            formData.append("video", document.getElementById('videoFile').files[0]);
            formData.append("caption", document.getElementById('captionTopic').value);
            formData.append("hashtags", document.getElementById('hashtagsData').value);
            formData.append("scheduled_at", document.getElementById('scheduledAt').value);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    status.innerText = "✅ " + result.message;
                    status.className = "text-sm text-center font-medium mt-3 text-green-600 block";
                    document.getElementById('uploadForm').reset();
                    document.getElementById('hashtagsData').value = "[]";
                } else {
                    throw new Error(result.error || "Upload failed");
                }
            } catch (error) {
                status.innerText = "❌ " + error.message;
                status.className = "text-sm text-center font-medium mt-3 text-red-600 block";
            } finally {
                btn.disabled = false;
                btn.innerText = "Schedule Upload";
            }
        });
    </script>
</body>
</html>
